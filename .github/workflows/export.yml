name: "Build Mobile (Android & iOS)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  export-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Godot ${{ env.GODOT_VERSION }}"
        run: |
          mkdir -p ~/godot && cd ~/godot
          FNAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FNAME}"
          echo "Downloading: $URL"
          wget -q "$URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64
          sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          echo "Godot version: $(godot --version)"

      - name: "Install Godot Export Templates"
        run: |
          TNAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TNAME}"
          echo "Downloading templates: $URL"
          wget -q "$URL" -O templates.tpz
          TMPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TMPL_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TMPL_DIR/"
          echo "Templates installed:"
          ls "$TMPL_DIR/"

      - name: "Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Install Android SDK build-tools"
        run: |
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at: $ANDROID_PATH"
          # Install latest build-tools explicitly
          sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34" 2>&1 | tail -5
          echo "Build-tools installed:"
          ls "$ANDROID_PATH/build-tools/"

      - name: "Configure Keystore & Godot Editor Settings"
        run: |
          # Generate debug keystore
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/.android/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "Keystore created: $(ls -la ~/.android/debug.keystore)"

          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA_PATH="${JAVA_HOME}"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"

          # Write editor settings (try both 4.tres and 4.7.tres)
          mkdir -p ~/.config/godot
          for SETTINGS_FILE in \
            ~/.config/godot/editor_settings-4.tres \
            ~/.config/godot/editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\n' \
              "$ANDROID_PATH" "$JAVA_PATH" "$KEYSTORE_PATH" \
              > "$SETTINGS_FILE"
          done

          echo "=== Editor Settings ==="
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: "Export Android Debug APK"
        run: |
          set -o pipefail
          mkdir -p build
          echo "=== Starting Godot Android export ==="
          godot -v --headless --export-debug "Android" build/SemeyCarDriving.apk 2>&1 | tee build/android_export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "=== Export finished with exit code: $EXPORT_EXIT ==="
          echo ""
          echo "=== Build directory contents ==="
          ls -lah build/ || true
          if [ ! -f build/SemeyCarDriving.apk ]; then
            echo "ERROR: APK was not created!"
            echo "=== Last 50 lines of export log ==="
            tail -50 build/android_export.log
            exit 1
          fi
          echo "SUCCESS: APK size: $(du -sh build/SemeyCarDriving.apk)"

      - name: "Upload APK Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-Android-APK
          path: |
            build/SemeyCarDriving.apk
            build/android_export.log

  export-ios:
    name: "Export iOS Project"
    runs-on: macos-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Godot ${{ env.GODOT_VERSION }} (macOS)"
        run: |
          FNAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_macos.universal.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FNAME}"
          echo "Downloading: $URL"
          curl -sL "$URL" -o godot.zip
          unzip -q godot.zip
          sudo cp -R "Godot.app" /Applications/
          sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          echo "Godot version: $(godot --version)"

      - name: "Install Godot Export Templates (macOS)"
        run: |
          TNAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TNAME}"
          echo "Downloading templates: $URL"
          curl -sL "$URL" -o templates.tpz
          TMPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TMPL_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TMPL_DIR/"
          echo "Templates installed:"
          ls "$TMPL_DIR/" | head -20

      - name: "Configure iOS Team ID"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "Injecting Apple Team ID: $APPLE_TEAM_ID"
            sed -i '' "s/application\/app_store_team_id=\"[^\"]*\"/application\/app_store_team_id=\"$APPLE_TEAM_ID\"/" export_presets.cfg 2>/dev/null || sed -i "s/application\/app_store_team_id=\"[^\"]*\"/application\/app_store_team_id=\"$APPLE_TEAM_ID\"/" export_presets.cfg
          else
            echo "Using placeholder app_store_team_id=ABCDE12345 from export_presets.cfg"
          fi
          grep -E "application/(app_store_team_id|signature)" export_presets.cfg

      - name: "Export iOS Xcode Project"
        run: |
          mkdir -p build/ios
          echo "=== Starting Godot iOS export (Project Only) ==="
          godot -v --headless --export-debug "iOS" build/ios/SemeyCarDriving.xcodeproj 2>&1 | tee build/ios/export.log
          echo "=== Build dir contents ==="
          ls -lah build/ios/

      - name: "Build IPA with xcodebuild"
        run: |
          cd build/ios
          echo "=== Searching for Xcode project ==="
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -n "$PROJ" ]; then
            echo "Found Xcode project: $PROJ"
            echo "Switching Xcode project to Manual signing..."
            sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/' "$PROJ/project.pbxproj" 2>/dev/null || sed -i 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/' "$PROJ/project.pbxproj"

            echo "Enforcing Landscape-only orientation in Info.plist..."
            PLIST=$(find . -name "*Info.plist" | head -n 1)
            if [ -n "$PLIST" ]; then
              echo "Patching orientation in $PLIST"
              plutil -replace UISupportedInterfaceOrientations -json '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST"
              plutil -replace "UISupportedInterfaceOrientations~ipad" -json '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST" 2>/dev/null || true
            fi

            echo "Compiling for iOS device (unsigned)..."
            xcodebuild \
              -project "$PROJ" \
              -scheme SemeyCarDriving \
              -configuration Debug \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath derived_data \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build 2>&1 | tee xcodebuild.log | tail -50

            APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Found compiled app at: $APP_PATH"
              echo "Packaging into SemeyCarDriving.ipa..."
              mkdir -p Payload && cp -R "$APP_PATH" Payload/
              zip -rq SemeyCarDriving.ipa Payload
              echo "SUCCESS: IPA created: $(du -sh SemeyCarDriving.ipa)"
            else
              echo "ERROR: App bundle not found in derived_data. Check last lines of xcodebuild:"
              tail -50 xcodebuild.log
              exit 1
            fi
            # Also create zip archive of Xcode project
            zip -rq SemeyCarDriving-XcodeProject.zip "$PROJ" SemeyCarDriving SemeyCarDriving.xcframework 2>/dev/null || true
          else
            echo "ERROR: Xcode project was not found in build/ios"
            exit 1
          fi

      - name: "Upload iOS Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-iOS
          path: |
            build/ios/*.ipa
            build/ios/SemeyCarDriving-XcodeProject.zip
            build/ios/*.log
