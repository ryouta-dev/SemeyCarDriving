name: "Build Mobile (Android & iOS)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Godot"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: "Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Generate Debug Keystore & Configure Editor Settings"
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: "Export Android Debug APK"
        run: |
          mkdir -p build
          godot -v --headless --export-debug "Android" build/SemeyCarDriving.apk

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-Android-APK
          path: build/SemeyCarDriving.apk

  export-ios:
    name: "Export iOS Project"
    runs-on: macos-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Godot on macOS"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: "Export iOS Project"
        run: |
          mkdir -p build/ios
          godot -v --headless --export-debug "iOS" build/ios/SemeyCarDriving.ipa || true

      - name: "Upload iOS Project Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-iOS-Build
          path: build/ios/
