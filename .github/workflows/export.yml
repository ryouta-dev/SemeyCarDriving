name: "Build Mobile (Android & iOS)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Godot"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: "Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Configure Keystore & Godot Settings"
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA_PATH="${JAVA_HOME}"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"

          echo "Detected Android SDK: $ANDROID_PATH"
          echo "Detected Java Home: $JAVA_PATH"

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_PATH"
export/android/java_sdk_path = "$JAVA_PATH"
export/android/debug_keystore = "$KEYSTORE_PATH"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
EOF

          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres

      - name: "Export Android Debug APK"
        run: |
          mkdir -p build
          godot -v --headless --export-debug "Android" build/SemeyCarDriving.apk

      - name: "Upload APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-Android-APK
          path: build/SemeyCarDriving.apk

  export-ios:
    name: "Export iOS Project"
    runs-on: macos-14
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Godot on macOS"
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: "Export iOS Project from Godot"
        run: |
          mkdir -p build/ios
          godot -v --headless --export-debug "iOS" build/ios/SemeyCarDriving.zip

      - name: "Build iOS App / IPA with xcodebuild"
        run: |
          cd build/ios
          unzip -q SemeyCarDriving.zip -d xcode_project
          cd xcode_project
          
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          if [ -n "$PROJ" ]; then
            echo "Found Xcode project: $PROJ"
            xcodebuild -project "$PROJ" \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath derived_data \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build || true

            APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Found compiled app at $APP_PATH. Packaging into IPA..."
              mkdir -p Payload
              cp -R "$APP_PATH" Payload/
              zip -rq ../SemeyCarDriving.ipa Payload
              echo "SemeyCarDriving.ipa generated successfully!"
            fi
          fi

      - name: "Upload iOS Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: SemeyCarDriving-iOS
          path: |
            build/ios/*.ipa
            build/ios/SemeyCarDriving.zip
